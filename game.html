<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mission Control · ONE in Marriage</title>
<meta name="description" content="Operation ONE — a 90-day game for couples. Notice the pattern. Choose the response." />
<meta name="theme-color" content="#122029" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23122029' stroke='%23c6a765' stroke-width='4'/%3E%3Ctext x='32' y='43' font-family='Georgia' font-size='32' text-anchor='middle' fill='%23e2c98f'%3E1%3C/text%3E%3C/svg%3E" />
<style>
@font-face{font-family:'Lora';font-style:normal;font-weight:500 600;font-display:swap;src:url(assets/fonts/lora-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Lora';font-style:normal;font-weight:500 600;font-display:swap;src:url(assets/fonts/lora-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+20A0-20AB,U+20AD-20C4,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Lora';font-style:italic;font-weight:500;font-display:swap;src:url(assets/fonts/lora-italic-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Outfit';font-style:normal;font-weight:400 800;font-display:swap;src:url(assets/fonts/outfit-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Outfit';font-style:normal;font-weight:400 800;font-display:swap;src:url(assets/fonts/outfit-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+20A0-20AB,U+20AD-20C4,U+2C60-2C7F,U+A720-A7FF}
:root{
  --night:#122029;--night-2:#192c37;--night-3:#223b49;--night-4:#2c4a5b;
  --hair:rgba(226,201,143,.16);--hair-2:rgba(255,255,255,.08);
  --cream:#faf6ee;--paper:#fffdf8;--ink:#2b2c26;--body:#5f635b;--muted:#8a8d84;--line:#e7e0d1;
  --sage:#7d9068;--sage-deep:#5f7350;--sage-soft:#e9efe1;--gold:#c6a765;--gold-2:#e2c98f;--tan-soft:#efe6d5;
  --on-night:#f3ecdc;--on-night-2:#b9b6a8;--red:#b4553f;
  --gA:#7d9068;--gB:#a3b487;--gC:#c6a765;--gD:#c98a5a;--gF:#b4553f;--gU:#8b8f99;
  --r:22px;--serif:'Lora',Georgia,serif;--sans:'Outfit',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--night);color:var(--on-night);font-family:var(--sans);font-size:16px;line-height:1.55;
  background-image:radial-gradient(1100px 600px at 80% -10%,rgba(198,167,101,.14),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(125,144,104,.16),transparent 60%),
  linear-gradient(var(--hair-2) 1px,transparent 1px),linear-gradient(90deg,var(--hair-2) 1px,transparent 1px);
  background-size:auto,auto,44px 44px,44px 44px;background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold-2)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* HUD */
.hud{position:sticky;top:0;z-index:30;background:rgba(18,32,41,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--hair);padding-top:env(safe-area-inset-top)}
.hud-in{display:flex;align-items:center;gap:12px;min-height:60px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--on-night);min-width:0}
.one{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-family:var(--serif);font-weight:600;color:var(--gold-2);font-size:17px}
.mark b{display:block;font-weight:700;font-size:15px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.hud-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.daychip{font-weight:700;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--hair);background:var(--night-2);white-space:nowrap}
.daychip em{font-style:normal;color:var(--gold-2)}
.viewas{display:flex;border:1px solid var(--hair);border-radius:999px;overflow:hidden;background:var(--night-2)}
.viewas button{border:0;background:none;padding:6px 10px;font-size:12px;font-weight:700;color:var(--on-night-2);max-width:92px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewas button[aria-pressed=true]{background:var(--gold);color:var(--night)}

main{padding:22px 0 120px}
.view{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(18,32,41,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--on-night-2);font-size:11px;font-weight:600;letter-spacing:.04em;min-height:56px;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--gold-2)}
.tab[aria-current=page]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 4px 4px;background:var(--gold)}
.tab .dot{position:absolute;top:8px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--night)}

/* Type */
.kicker{font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.15;margin:0}
h1{font-size:clamp(30px,7vw,46px)}
h2{font-size:clamp(23px,5vw,30px)}
h3{font-size:19px}
.lead{color:var(--on-night-2);font-size:16.5px;margin:10px 0 0}
.muted{color:var(--on-night-2)}
.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}

/* Panels */
.panel{background:linear-gradient(180deg,var(--night-2),rgba(25,44,55,.82));border:1px solid var(--hair);border-radius:var(--r);padding:20px}
.paper{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.35);position:relative}
.paper .kicker{color:#8a6c3d}
.paper .muted{color:var(--body)}
.paper a{color:var(--sage-deep)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}.grid3.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:12px}.stat b{font-size:22px}.stat span{font-size:10.5px;letter-spacing:.05em}}
@media (max-width:520px){.mark>span:last-child{display:none}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 22px;min-height:48px;font-weight:700;font-size:15.5px;border:1.5px solid transparent;text-decoration:none;transition:transform .12s ease,background .2s}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#1d2a22;box-shadow:0 10px 26px rgba(198,167,101,.28)}
.btn-ghost{background:transparent;border-color:var(--hair);color:var(--on-night)}
.btn-sage{background:var(--sage);color:#fff}
.btn-ink{background:var(--night);color:var(--on-night)}
.btn-line{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-sm{padding:8px 14px;min-height:38px;font-size:13.5px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.linkbtn{border:0;background:none;padding:0;color:var(--gold-2);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.paper .linkbtn{color:var(--sage-deep)}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:700;letter-spacing:.04em;padding:5px 10px;border-radius:999px;background:rgba(198,167,101,.14);color:var(--gold-2);border:1px solid var(--hair)}
.paper .chip{background:var(--tan-soft);color:#7a5c2e;border-color:transparent}
.chip.sage{background:rgba(125,144,104,.2);color:#cfe0bd}
.paper .chip.sage{background:var(--sage-soft);color:var(--sage-deep)}

/* Forms */
label.f{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
.input,select.input,textarea.input{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--hair);background:var(--night);color:var(--on-night);font-size:16px}
.paper .input{background:#fff;border-color:var(--line);color:var(--ink)}
textarea.input{min-height:96px;resize:vertical;line-height:1.5}
.input:focus{outline:2px solid var(--gold);outline-offset:1px}
.field{margin-bottom:16px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--hair);border-radius:14px;background:rgba(0,0,0,.12);cursor:pointer}
.paper .check{border-color:var(--line);background:var(--cream)}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--sage);flex:none}
.help{font-size:13px;color:var(--on-night-2);margin-top:6px}
.paper .help{color:var(--body)}

/* INTRO */
.intro{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:40px 0 60px}
.intro .one{width:64px;height:64px;font-size:32px;border-width:2.5px;margin-bottom:26px;box-shadow:0 0 0 8px rgba(198,167,101,.08),0 0 60px rgba(198,167,101,.25)}
.type{font-family:var(--serif);font-style:italic;font-size:clamp(21px,4.6vw,27px);color:var(--gold-2);min-height:2.6em;margin:18px 0 8px}
.type .cur{display:inline-block;width:2px;height:1em;background:var(--gold-2);vertical-align:-3px;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.intro-title{font-size:clamp(38px,10vw,68px);letter-spacing:-.01em}
.intro-title span{color:var(--gold-2)}
.stats-strip{display:flex;gap:22px;flex-wrap:wrap;margin:22px 0 30px;color:var(--on-night-2);font-size:14px}
.stats-strip b{display:block;font-family:var(--serif);font-size:28px;color:var(--on-night)}
.fuse{position:relative;overflow:hidden}
.fuse::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,#fff6,var(--red));transform-origin:left;animation:fuse 9s linear infinite}
@keyframes fuse{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.intro-actions{display:flex;flex-direction:column;gap:12px;max-width:380px}

/* Setup */
.steps-dots{display:flex;gap:8px;margin:14px 0 22px}
.steps-dots i{height:6px;flex:1;border-radius:6px;background:var(--hair-2)}
.steps-dots i.on{background:var(--gold)}
.lens-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.lens-pick{grid-template-columns:repeat(2,1fr)}}
.lens-pick button{border:1.5px solid var(--hair);background:var(--night);border-radius:14px;padding:10px 6px;font-weight:700;font-size:14px;color:var(--on-night)}
.lens-pick button[aria-pressed=true]{border-color:var(--gold);background:rgba(198,167,101,.18);color:var(--gold-2)}
.sheet .lens-pick button{background:#fff;color:var(--ink);border-color:var(--line)}
.sheet .lens-pick button[aria-pressed=true]{border-color:var(--sage);background:var(--sage-soft);color:var(--sage-deep)}
.envelope .linkbtn{color:var(--sage-deep)}
.range{width:100%;accent-color:var(--gold)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1;min-width:100px;border:1.5px solid var(--hair);background:var(--night);border-radius:14px;padding:12px 10px;font-weight:700;color:var(--on-night)}
.seg button[aria-pressed=true]{border-color:var(--gold);background:rgba(198,167,101,.18);color:var(--gold-2)}

/* HQ */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.codename{font-family:var(--serif);font-size:clamp(28px,7vw,40px)}
.stat{background:var(--night-2);border:1px solid var(--hair);border-radius:18px;padding:14px 16px}
.stat b{display:block;font-family:var(--serif);font-size:26px;line-height:1.1}
.stat span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-night-2);font-weight:700}
.today{position:relative;overflow:hidden}
.today .stamp{position:absolute;top:18px;right:-34px;transform:rotate(35deg);background:var(--red);color:#fff;font-size:11px;font-weight:800;letter-spacing:.2em;padding:5px 40px}
.today h2{margin:8px 0 6px;padding-right:40px}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:5px 12px;background:var(--tan-soft);color:#7a5c2e}
.status-pill.ok{background:var(--sage-soft);color:var(--sage-deep)}
.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{flex:none;width:118px;height:118px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .num b{font-family:var(--serif);font-size:30px;display:block}
.ring .num span{font-size:11px;color:var(--on-night-2);font-weight:700;letter-spacing:.06em}
.track{position:relative;height:10px;border-radius:10px;background:var(--night);border:1px solid var(--hair);margin:14px 0 6px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:10px;background:linear-gradient(90deg,var(--sage),var(--gold))}
.track u{position:absolute;top:-5px;width:3px;height:18px;border-radius:3px;background:var(--on-night-2);text-decoration:none}
.track u.hit{background:var(--gold-2)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.vs .mid{display:grid;place-items:center;font-family:var(--serif);font-style:italic;color:var(--gold-2);font-size:20px}
.opp{background:var(--night);border:1px solid var(--hair);border-radius:16px;padding:14px}
.opp b{font-family:var(--serif);font-size:19px;display:block;color:var(--gold-2)}
.opp p{margin:6px 0 0;font-size:13.5px;color:var(--on-night-2)}
@media (max-width:560px){.vs{grid-template-columns:1fr}.vs .mid{padding:2px 0}}
.strip{display:grid;grid-template-columns:repeat(30,1fr);gap:3px}
.strip i{aspect-ratio:1;border-radius:3px;background:var(--night);border:1px solid var(--hair-2)}

/* grades colours */
.g-A{background:var(--gA)!important;border-color:var(--gA)!important}.g-B{background:var(--gB)!important;border-color:var(--gB)!important}.g-C{background:var(--gC)!important;border-color:var(--gC)!important}
.g-D{background:var(--gD)!important;border-color:var(--gD)!important}.g-F{background:var(--gF)!important;border-color:var(--gF)!important}.g-U{background:var(--gU)!important;border-color:var(--gU)!important}
.g-off{background:repeating-linear-gradient(45deg,var(--night-3),var(--night-3) 3px,var(--night) 3px,var(--night) 6px)!important}
.is-today{outline:2px solid var(--gold-2);outline-offset:1px}

/* Mission */
.envelope{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:28px 22px;position:relative;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.envelope::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent 0 22px,rgba(169,130,79,.05) 22px 44px);pointer-events:none}
.classified{display:inline-block;border:2.5px solid var(--red);color:var(--red);font-weight:800;letter-spacing:.24em;font-size:13px;padding:4px 10px;transform:rotate(-4deg);border-radius:4px;margin-bottom:14px}
.envelope h1{color:var(--ink);font-size:clamp(28px,6.5vw,40px);margin:8px 0 12px}
.brief{font-family:var(--serif);font-style:italic;font-size:19px;color:#4b4e46;margin:0 0 20px}
.ol{list-style:none;counter-reset:s;padding:0;margin:0}
.ol li{counter-increment:s;position:relative;padding:0 0 14px 44px}
.ol li::before{content:counter(s);position:absolute;left:0;top:-1px;width:30px;height:30px;border-radius:50%;background:var(--sage);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.roles{grid-template-columns:1fr}}
.role{border:1.5px solid var(--line);border-radius:18px;padding:16px;background:var(--cream);position:relative}
.role.me{border-color:var(--gold);background:#fff8e8;box-shadow:0 0 0 4px rgba(198,167,101,.18)}
.role .who{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8a6c3d}
.role h3{margin:4px 0 8px;color:var(--ink)}
.role .you{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;background:var(--gold);color:var(--night);padding:3px 8px;border-radius:999px}
.role .lead{font-size:11px;font-weight:800;color:var(--sage-deep)}
.note{border-left:3px solid var(--sage);padding:4px 0 4px 14px;margin:16px 0;color:var(--body)}
.note b{color:var(--ink)}
.qbox{background:var(--night);color:var(--on-night);border-radius:18px;padding:18px;margin-top:18px}
.qbox .kicker{color:var(--gold)}
.qbox p{font-family:var(--serif);font-size:19px;margin:6px 0 0}
.toggle-ver{display:flex;background:var(--tan-soft);border-radius:999px;padding:4px;gap:4px;width:max-content;max-width:100%}
.toggle-ver button{border:0;background:none;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px;color:#7a5c2e}
.toggle-ver button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.timer{display:flex;align-items:center;gap:16px}
.timer .t{font-family:var(--serif);font-size:34px;font-variant-numeric:tabular-nums;min-width:110px}
.reveal{animation:unfold .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes unfold{from{opacity:0;transform:perspective(900px) rotateX(-12deg) translateY(-8px)}to{opacity:1;transform:none}}
.offduty{text-align:center;padding:34px 22px}
.offduty .big{font-size:52px;line-height:1}

/* Tonight */
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.grades{grid-template-columns:repeat(2,1fr)}}
.gbtn{border:2px solid var(--line);border-radius:18px;background:#fff;padding:14px 10px;text-align:left;color:var(--ink);min-height:96px}
.gbtn b{font-family:var(--serif);font-size:30px;line-height:1;display:block}
.gbtn span{font-size:13px;color:var(--body);display:block;margin-top:6px;line-height:1.3}
.gbtn[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 4px rgba(43,44,38,.12)}
.gbtn[data-g=A] b{color:var(--gA)}.gbtn[data-g=B] b{color:#7f925f}.gbtn[data-g=C] b{color:#a8873f}.gbtn[data-g=D] b{color:var(--gD)}.gbtn[data-g=F] b{color:var(--gF)}.gbtn[data-g=U] b{color:var(--gU)}
.daytabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:520px){.cards{grid-template-columns:1fr}}
.gc{border:1px solid var(--hair);border-radius:18px;background:var(--night-2);padding:16px;text-align:left;color:var(--on-night);display:flex;flex-direction:column;gap:6px;min-height:118px;transition:transform .15s,border-color .2s}
.gc:hover{transform:translateY(-2px);border-color:var(--gold)}
.gc .kicker{font-size:10.5px}
.gc b{font-family:var(--serif);font-size:18px;line-height:1.2}
.gc p{margin:0;font-size:13.5px;color:var(--on-night-2)}
.gc.sel{border-color:var(--gold);background:rgba(198,167,101,.14)}
.gc.locked{opacity:.5}
.gc.earned{border-color:var(--sage)}
.badge-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--night);border:1px solid var(--hair)}
.gc.locked .badge-ico{filter:grayscale(1)}

/* Kit */
.jar{border:1px solid var(--hair);border-radius:22px;background:radial-gradient(120px 80px at 50% 0%,rgba(226,201,143,.16),transparent),var(--night-2);padding:18px;text-align:center;color:var(--on-night)}
.jar .ico{font-size:40px;line-height:1;margin-bottom:8px;display:block}
.jar b{font-family:var(--serif);font-size:18px;display:block}
.jar p{font-size:13px;color:var(--on-night-2);margin:4px 0 0}

/* Map */
.map{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.map button{aspect-ratio:1;border-radius:10px;border:1px solid var(--hair);background:var(--night-2);color:var(--on-night);font-weight:700;font-size:13px;padding:0;display:grid;place-items:center;position:relative}
.map button.locked{opacity:.35}
.map button.role::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--gold-2)}
.map button[class*=g-]{color:#14202a}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--on-night-2);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--hair)}
.subnav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:14px 0 6px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:none;border:1px solid var(--hair);background:var(--night-2);color:var(--on-night-2);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px}
.subnav button[aria-pressed=true]{background:var(--gold);color:var(--night);border-color:var(--gold)}

/* Guide md */
.md h1{font-size:28px;margin:0 0 10px}.md h2{font-size:21px;margin:24px 0 8px}.md h3{font-size:17px;margin:18px 0 6px}
.md p,.md li{color:var(--body)}.md strong{color:var(--ink)}.md ul,.md ol{padding-left:22px}

/* Modal */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,14,18,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:26px 26px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;position:sticky;top:-22px;background:var(--paper);padding-top:4px;z-index:1}
.x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;line-height:1;color:var(--ink)}
.sheet .kicker{color:#8a6c3d}
.sheet .muted{color:var(--body)}

/* Flip card */
.flip{perspective:1000px;margin:8px auto 16px;max-width:360px}
.flip-in{position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1);min-height:240px}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:22px;display:flex;flex-direction:column;justify-content:center}
.face.front{background:var(--night);color:var(--gold-2);align-items:center;text-align:center;border:2px solid var(--gold)}
.face.front .one{width:70px;height:70px;font-size:34px}
.face.back{transform:rotateY(180deg);background:var(--cream);border:2px solid var(--line)}
.face.back b{font-family:var(--serif);font-size:22px;margin:6px 0 8px;display:block}

/* Breaker */
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0 16px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.chain span{padding:5px 9px;border-radius:999px;background:var(--tan-soft);color:#9b8a6a}
.chain span.on{background:var(--sage);color:#fff}
.chain span.done{background:var(--sage-soft);color:var(--sage-deep)}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:12px 14px;margin-bottom:8px;color:var(--ink);font-weight:600}
.opt[aria-pressed=true]{border-color:var(--sage);background:var(--sage-soft)}

/* Toast, overlays */
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:80;display:flex;justify-content:center;pointer-events:none}
.toast{background:var(--paper);color:var(--ink);padding:12px 18px;border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.4);font-weight:600;font-size:14.5px;max-width:100%;display:flex;gap:10px;align-items:center;animation:up .3s ease}
.launch{position:fixed;inset:0;z-index:90;background:var(--night);display:grid;place-items:center;text-align:center}
.launch .n{font-family:var(--serif);font-size:120px;color:var(--gold-2);animation:pop .9s ease both}
@keyframes pop{from{transform:scale(1.6);opacity:0}30%{opacity:1}to{transform:scale(.9);opacity:.2}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:85}
.empty{border:1.5px dashed var(--hair);border-radius:18px;padding:22px;text-align:center;color:var(--on-night-2)}
.footer-note{font-size:12.5px;color:var(--on-night-2);text-align:center;margin-top:34px}
.footer-note a{color:var(--on-night-2)}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.sig{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Print: only the agreement */
@media print{
  body{background:#fff;color:#000}
  .hud,.tabs,.no-print,#toast{display:none!important}
  main{padding:0}
  .print-only{display:block!important}
  .view>*:not(.print-area){display:none!important}
  .print-area .paper{box-shadow:none}
}
.print-only{display:none}

<script src="game-content.js"></script>
<script>
(function () {
'use strict';
var KEY = 'oim-mission-v1', GKEY = 'oim-mission-game-v1';
var BUILTIN = window.OIM_BUILTIN_GAME;
var LENSES = {
  Savior: { rule: 'I need to help or put things right to feel valuable.', gift: 'Care that shows up', reflection: 'Am I being asked to help, or am I making myself responsible?' },
  Survivor: { rule: 'I need to protect myself and remain someone I can count on.', gift: 'Strength and resilience', reflection: 'What evidence says I’m unsafe right now, and what am I assuming?' },
  Prover: { rule: 'I need to perform well enough to know I’m enough.', gift: 'Drive and excellence', reflection: 'What would I choose here if my worth were not being tested?' },
  Martyr: { rule: 'I need to put others first to remain loving and lovable.', gift: 'Generous devotion', reflection: 'What do I need to say directly instead of hoping my sacrifice will communicate it?' },
  Analyst: { rule: 'I need to understand it and make it make sense before I can settle.', gift: 'Clarity and insight', reflection: 'What feeling needs acknowledgment before this problem needs a solution?' },
  Endurer: { rule: 'I need to keep carrying the hard things without asking for relief.', gift: 'Steadiness under weight', reflection: 'Just because I can carry this, does that mean I need to keep carrying it?' },
  Ghost: { rule: 'I’m safer staying in the background than taking up space.', gift: 'Calm, unhurried presence', reflection: 'What would I say or ask for if I believed my presence mattered?' },
  Chameleon: { rule: 'I need to adjust to what others want to stay connected.', gift: 'Deep attunement to others', reflection: 'What is true for me before I adjust to what someone else wants?' }
};
var GRADES = [
  ['A', 'We felt like a team today'], ['B', 'Mostly good — we handled the bumps'], ['C', 'Mixed. We got through'],
  ['D', 'A hard day'], ['F', 'A very hard day'], ['U', 'We can’t agree yet']
];
var RANKS = [[0, 'Recruit'], [3, 'Field Agent'], [10, 'Specialist'], [25, 'Operative'], [45, 'Senior Operative'], [70, 'Commander'], [90, 'Legend']];
var BADGES = [
  ['accepted', '✉️', 'Mission Accepted', 'Accept your first mission.'],
  ['first', '📡', 'First Contact', 'Settle your first nightly grade.'],
  ['week', '🗓️', 'One Week In', 'Grade 7 days (any grades).'],
  ['reward', '🎁', 'Earned It', 'Claim your first daily reward.'],
  ['rest', '🌙', 'Rest Is Allowed', 'Take an Off Duty day without guilt.'],
  ['repair', '🧰', 'Repair Crew', 'Use repair cards 3 times.'],
  ['breaker', '🔗', 'Pattern Breaker', 'Walk a moment through the Pattern Breaker.'],
  ['jar', '🏺', 'Jar Diver', 'Draw 5 jar cards.'],
  ['lens', '🔍', 'Lens Literate', 'Save both partners’ lenses.'],
  ['villain', '🦹', 'Know Your Opponent', 'Give your pattern a villain name.'],
  ['journal', '📓', 'Field Notes', 'Write your first private journal entry.'],
  ['souvenir', '📸', 'Keepsake Keeper', 'Save 3 field souvenirs.'],
  ['agreement', '📜', 'Signed & Sealed', 'Write all five Articles and sign them.'],
  ['act1', '🌅', 'Act I Complete', 'Reach Day 30 and grade it.'],
  ['act2', '🌿', 'Act II Complete', 'Reach Day 60 and grade it.'],
  ['done', '🏆', 'Mission Complete', 'Grade Day 90.']
];
var ARTICLES = [
  ['I', 'Safety', 'How we keep each other safe when things get heated.'],
  ['II', 'Patterns', 'Our loop, our villain, our code phrase, our new moves.'],
  ['III', 'Lenses', 'What each lens needs, and the gift each lens brings.'],
  ['IV', 'Repair & Return', 'Our pause signal, return time, and clean apology.'],
  ['V', 'What We Build', 'Our values, rituals, dreams and next project.']
];

/* ---------- state ---------- */
function fresh() {
  return { v: 1, gameId: null, settings: null, viewAs: 'both', grades: {}, grants: [], offDuty: [], accepted: {}, small: {},
    jarDraws: 0, repairsUsed: 0, breaks: [], badges: {}, journal: { partner_a: {}, partner_b: {} }, souvenirs: {},
    agreement: {}, practiceDay: 1, welcome: {}, pauses: [] };
}
function readJSON(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
var S = readJSON(KEY) || fresh();
var G = readJSON(GKEY) || BUILTIN;
if (!S.journal) S.journal = { partner_a: {}, partner_b: {} };
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('This browser would not save your progress. Download a backup from Dossier → Settings.'); }
}
var ui = { view: S.settings ? 'hq' : 'intro', sub: 'map', setupStep: 0, draft: null, gradeDay: null, gradePick: null, agreed: false, timer: null };

/* ---------- helpers ---------- */
function $(s, r) { return (r || document).querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function nm(slot) { if (!S.settings) return slot === 'partner_a' ? 'Partner A' : 'Partner B'; return slot === 'partner_a' ? S.settings.a : S.settings.b; }
function fill(s) { return esc(s).replace(/\{A\}/g, esc(nm('partner_a'))).replace(/\{B\}/g, esc(nm('partner_b'))); }
function inline(s) { return fill(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function todayStr(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dnum(s) { var p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5; }
function diff(a, b) { return Math.round(dnum(a) - dnum(b)); }
function addDays(s, n) { var p = s.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function niceDate(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); }
function money(minor) { return '$' + (minor / 100).toFixed(minor % 100 ? 2 : 0); }
function mission(day) { return G.missions.filter(function (m) { return m.day === day; })[0]; }
function cardById(id) { var all = G.support_cards.concat(G.bonus_missions || []); for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i]; return null; }
function cardsOf(kind) { return G.support_cards.filter(function (c) { return c.kind === kind; }); }
function actOf(day) { return day <= 30 ? ['Act I', 'See'] : day <= 60 ? ['Act II', 'Soften & Repair'] : ['Act III', 'Create']; }
function isBuiltin() { return G === BUILTIN || G.game_id === BUILTIN.game_id; }

function dayInfo() {
  var t = todayStr();
  if (!S.settings) return { day: 1, cal: 1, started: false, finished: false, paused: false, date: t };
  if (S.settings.practice) return { day: S.practiceDay, cal: S.practiceDay, started: true, finished: false, paused: false, date: t, practice: true };
  var el = diff(t, S.settings.startDate);
  (S.pauses || []).forEach(function (p) { var end = p.end && p.end < t ? p.end : t; el -= Math.max(0, diff(end, p.start)); });
  var raw = el + 1;
  return { day: Math.max(1, Math.min(90, raw)), cal: raw, started: raw >= 1, finished: raw > 90,
    paused: (S.pauses || []).some(function (p) { return !p.end; }), date: t };
}
function thresholds(T) {
  var out = [];
  [25, 50, 75].forEach(function (p) { var x = Math.floor(T * p / 100); if (x > 0 && x < T && out.indexOf(x) < 0) out.push(x); });
  return out.sort(function (a, b) { return a - b; });
}
function progress() {
  var a = 0, b = 0, rec = 0;
  for (var d in S.grades) { rec++; if (S.grades[d].grade === 'A') a++; if (S.grades[d].grade === 'B') b++; }
  var st = S.settings || {}, T = st.target || null;
  var W = T ? (st.basis === 'A' ? a : a + b) : null;
  var pending = Object.keys(S.grades).filter(function (d) { return /[AB]/.test(S.grades[d].grade) && !S.grants.some(function (g) { return g.key === 'daily:' + d; }); }).map(Number).sort(function (x, y) { return x - y; });
  return { a: a, b: b, daily: a + b, recorded: rec, target: T, score: W, th: T ? thresholds(T) : [], pending: pending };
}
function rank() { var n = progress().recorded, r = RANKS[0]; RANKS.forEach(function (x) { if (n >= x[0]) r = x; }); var nx = RANKS.filter(function (x) { return x[0] > n; })[0]; return { name: r[1], next: nx }; }
function gradableDays() {
  var d = dayInfo(), out = [];
  if (!S.settings || !d.started) return out;
  if (d.practice) { if (!S.grades[d.day]) out.push(d.day); return out; }
  [d.cal, d.cal - 1].forEach(function (x) { if (x >= 1 && x <= 90 && !S.grades[x] && !(d.paused && x >= d.day)) out.push(x); });
  return out;
}
function syncRewards() {
  var st = S.settings; if (!st || !st.target || !st.rewardsAdopted) return;
  var p = progress(), now = new Date().toISOString();
  G.support_cards.forEach(function (c) {
    if (!c.reward) return;
    var key = 'once:' + c.id; if (S.grants.some(function (g) { return g.key === key; })) return;
    if (c.kind === 'milestone') { var th = p.th[(c.reward.milestone_order || 1) - 1]; if (th && p.score >= th) { S.grants.push({ key: key, cardId: c.id, earnedAt: now, redeemedAt: null }); celebrate('Milestone unlocked: ' + c.title); } }
    if (c.kind === 'final' && p.score >= p.target) { S.grants.push({ key: key, cardId: c.id, earnedAt: now, redeemedAt: null }); celebrate('Target reached! ' + c.title + ' unlocked'); }
  });
}
function rewardChoices() {
  var funded = S.settings && S.settings.budget && S.settings.budget !== 'free';
  return cardsOf('reward').filter(function (c) {
    if (c.reward && c.reward.funded_only && !funded) return false;
    if (c.reward && c.reward.max_earnings_per_game === 1 && S.grants.some(function (g) { return g.cardId === c.id; })) return false;
    var u = c.reward && c.reward.catalog_unlock; if (u && progress().daily < u.count) return false;
    return true;
  });
}

/* ---------- badges ---------- */
function badgeTest(id) {
  var p = progress();
  switch (id) {
    case 'accepted': return Object.keys(S.accepted).length > 0;
    case 'first': return p.recorded >= 1;
    case 'week': return p.recorded >= 7;
    case 'reward': return S.grants.some(function (g) { return g.key.indexOf('daily:') === 0; });
    case 'rest': return S.offDuty.length > 0;
    case 'repair': return S.repairsUsed >= 3;
    case 'breaker': return S.breaks.length > 0;
    case 'jar': return S.jarDraws >= 5;
    case 'lens': return !!(S.settings && S.settings.lensA && S.settings.lensB);
    case 'villain': return !!(S.settings && S.settings.villain);
    case 'journal': return Object.keys(S.journal.partner_a).length + Object.keys(S.journal.partner_b).length > 0;
    case 'souvenir': return Object.keys(S.souvenirs).length >= 3;
    case 'agreement': return ARTICLES.every(function (a) { return (S.agreement[a[0]] || '').trim(); }) && !!(S.agreement.sigA && S.agreement.sigB);
    case 'act1': return !!S.grades[30]; case 'act2': return !!S.grades[60]; case 'done': return !!S.grades[90];
  }
  return false;
}
function checkBadges() {
  var got = [];
  BADGES.forEach(function (b) { if (!S.badges[b[0]] && badgeTest(b[0])) { S.badges[b[0]] = new Date().toISOString(); got.push(b); } });
  if (got.length) { save(); setTimeout(function () { celebrate(got[0][1] + ' Badge unlocked: ' + got[0][2]); }, 250); }
}
function commit() { syncRewards(); save(); checkBadges(); render(); }

/* ---------- confetti & toast ---------- */
var cv = $('#confetti'), cx = cv.getContext('2d'), parts = [], raf = null;
function confetti() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  var cols = ['#e2c98f', '#c6a765', '#7d9068', '#faf6ee', '#a3b487'];
  for (var i = 0; i < 140; i++) parts.push({ x: cv.width / 2, y: cv.height * .45, vx: (Math.random() - .5) * 26 * devicePixelRatio, vy: (-Math.random() * 22 - 6) * devicePixelRatio, s: (4 + Math.random() * 6) * devicePixelRatio, c: cols[i % cols.length], r: Math.random() * 6, vr: (Math.random() - .5) * .3, life: 0 });
  if (!raf) tick();
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(function (p) { return p.life < 140 && p.y < cv.height + 40; });
  parts.forEach(function (p) { p.life++; p.vy += .7 * devicePixelRatio; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore(); });
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, cv.width, cv.height), null);
}
var toastT;
function toast(msg) { var t = $('#toast'); t.innerHTML = '<div class="toast">' + esc(msg) + '</div>'; clearTimeout(toastT); toastT = setTimeout(function () { t.innerHTML = ''; }, 3600); }
function celebrate(msg) { confetti(); toast(msg); }

/* ---------- modal ---------- */
function modal(html, onMount) {
  var root = $('#modalRoot');
  root.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="sheet">' + html + '</div></div>';
  var m = root.firstChild;
  m.addEventListener('click', function (e) { if (e.target === m || e.target.closest('[data-close]')) closeModal(); });
  document.body.style.overflow = 'hidden';
  var f = m.querySelector('[data-close]'); if (f) f.focus();
  if (onMount) onMount(m.querySelector('.sheet'));
}
function closeModal() { $('#modalRoot').innerHTML = ''; document.body.style.overflow = ''; }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
function sheetHead(kicker, title) { return '<div class="sheet-h"><div><div class="kicker">' + kicker + '</div><h2 style="margin-top:4px">' + title + '</h2></div><button class="x" data-close aria-label="Close">×</button></div>'; }

/* ---------- markdown (escaped first) ---------- */
function md(src) {
  var out = [], list = null;
  function close() { if (list) { out.push('</' + list + '>'); list = null; } }
  src.split(/\n/).forEach(function (line) {
    var l = line.trim(), m;
    if (!l) { close(); return; }
    if ((m = l.match(/^(#{1,3})\s+(.*)$/))) { close(); var n = m[1].length; out.push('<h' + n + '>' + inline(m[2]) + '</h' + n + '>'); return; }
    if ((m = l.match(/^[-*]\s+(.*)$/))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inline(m[1]) + '</li>'); return; }
    if ((m = l.match(/^\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inline(m[1]) + '</li>'); return; }
    if (/^\|/.test(l) || /^---+$/.test(l)) { close(); out.push('<p>' + inline(l.replace(/\|/g, ' · ').replace(/^ · | · $/g, '')) + '</p>'); return; }
    close(); out.push('<p>' + inline(l) + '</p>');
  });
  close(); return out.join('');
}

/* ---------- consent-safe card ---------- */
function welcomeToday(id) { return S.welcome[id] === todayStr(); }
function safe(c) {
  if (!c || !c.invitations || !c.invitations.length || welcomeToday(c.id)) return c;
  var alts = c.invitations.map(function (i) { return i.nonphysical_alternative; });
  var x = {}; for (var k in c) x[k] = c[k];
  x.title = (c.romance ? '♥ ' : '') + 'A moment of connection'; x.steps = alts; x.dual_role = false; x.roles = [];
  x.guidance = 'Choose what feels welcome today. This version is complete in itself.'; x.example = '';
  x.small_version = alts[0]; x.adapted = true; x.small_or_free_option = alts[0];
  return x;
}

  h += '<div class="panel sec"><div class="kicker">Start over</div><p class="muted" style="margin:6px 0 12px">Erase this operation from this device — grades, journals, agreement, everything.</p><button class="btn btn-ghost btn-sm" id="reset" style="border-color:var(--red);color:#e7a493">Erase and start over</button></div>';
  return h;
}
function aDossier() {
  [].forEach.call(document.querySelectorAll('[data-sub2]'), function (b) { b.onclick = function () { ui.sub = b.getAttribute('data-sub2'); render(); }; });
  if (ui.sub === 'agreement') {
    var saveArt = function (quiet) {
      [].forEach.call(document.querySelectorAll('[data-art]'), function (x) { S.agreement[x.getAttribute('data-art')] = x.value.trim(); });
      if (S.agreement.sigA && S.agreement.sigB && !S.agreement.signedOn) S.agreement.signedOn = todayStr();
      if (!(S.agreement.sigA && S.agreement.sigB)) delete S.agreement.signedOn;
      if (!quiet) toast('Agreement saved.'); syncRewards(); save(); checkBadges();
    };
    $('#artSave').onclick = function () { saveArt(); render(); };
    $('#artPrint').onclick = function () { saveArt(true); render(); setTimeout(function () { window.print(); }, 50); };
  }
  if (ui.sub === 'journal') {
    [].forEach.call(document.querySelectorAll('[data-jw]'), function (b) { b.onclick = function () { S.viewAs = b.getAttribute('data-jw'); save(); render(); }; });
    $('#jd').onchange = function () { ui.jDate = this.value; render(); };
    [].forEach.call(document.querySelectorAll('[data-jdate]'), function (b) { b.onclick = function () { ui.jDate = b.getAttribute('data-jdate'); render(); }; });
    $('#jSave').onclick = function () {
      var who = S.viewAs === 'partner_b' ? 'partner_b' : 'partner_a', date = $('#jd').value || todayStr(), e = {};
      for (var i = 0; i < 3; i++) e['q' + i] = $('#jq' + i).value.trim();
      S.journal[who] = S.journal[who] || {};
      if (e.q0 || e.q1 || e.q2) S.journal[who][date] = e; else delete S.journal[who][date];
      toast('Saved privately on this device.'); commit();
    };
  }
  if (ui.sub === 'settings') {
    $('#editSetup').onclick = function () { ui.draft = null; ui.setupStep = 0; go('setup'); };
    [].forEach.call(document.querySelectorAll('[data-tool2]'), function (b) { b.onclick = function () { tool(b.getAttribute('data-tool2')); }; });
    if ($('#pause')) $('#pause').onclick = function () { confirmBox('Pause the game?', 'Only pause if you both agree. You can resume any time.', 'Pause', function () { S.pauses.push({ start: todayStr(), end: null }); commit(); }); };
    if ($('#resume')) $('#resume').onclick = function () { S.pauses.forEach(function (p) { if (!p.end) p.end = todayStr(); }); toast('Welcome back, agents.'); commit(); };
    $('#load2').onclick = function () { $('#gameFile').click(); };
    if ($('#useBuiltin')) $('#useBuiltin').onclick = function () { confirmBox('Switch to the starter game?', 'Your progress for this game will be erased from this device. Download a backup first if you want to keep it.', 'Switch and erase', function () { try { localStorage.removeItem(GKEY); } catch (e) {} G = BUILTIN; var keep = S.settings; S = fresh(); keep.practice = false; S.settings = keep; S.gameId = G.game_id; commit(); }); };
    $('#dl').onclick = backup;
    $('#rs').onclick = function () { $('#backupFile').click(); };
    $('#prac').onchange = function () { S.settings.practice = this.checked; commit(); };
    if ($('#pday')) $('#pday').oninput = function () { S.practiceDay = +this.value; $('#pdv').textContent = this.value; save(); }, $('#pday').onchange = function () { ui.missionDay = null; render(); };
    $('#reset').onclick = function () { confirmBox('Erase everything?', 'This removes the whole operation from this device and can’t be undone. Download a backup first if you might want it.', 'Erase', function () { try { localStorage.removeItem(KEY); localStorage.removeItem(GKEY); } catch (e) {} S = fresh(); G = BUILTIN; ui.view = 'intro'; render(); }); };
  }
}
function confirmBox(title, msg, yes, fn) {
  modal(sheetHead('Please confirm', esc(title)) + '<p class="muted">' + esc(msg) + '</p><div class="row" style="margin-top:16px"><button class="btn btn-ink" id="cy">' + esc(yes) + '</button><button class="btn btn-line" data-close>Cancel</button></div>',
    function (sh) { $('#cy', sh).onclick = function () { closeModal(); fn(); }; });
}

/* ---------- backup / load ---------- */
function download(name, text) {
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function backup() {
  download('mission-control-backup-' + todayStr() + '.json', JSON.stringify({ kind: 'oim-mission-backup', v: 1, savedAt: new Date().toISOString(), state: S, game: isBuiltin() ? null : G }));
  toast('Backup downloaded. It includes private journals — keep it somewhere safe.');
}
function readFile(input, cb) {
  var f = input.files && input.files[0]; input.value = ''; if (!f) return;
  if (f.size > 8e6) { toast('That file is too large to be a game file.'); return; }
  var r = new FileReader(); r.onload = function () { var j; try { j = JSON.parse(r.result); } catch (e) { toast('That file isn’t valid JSON.'); return; } cb(j); }; r.readAsText(f);
}
function validGame(g) {
  if (!g || typeof g !== 'object') return 'That isn’t a game file.';
  if (['1.0.0', '2.0.0', '2.1.0'].indexOf(g.schema_version) < 0) return 'Unsupported game format' + (g.schema_version ? ' (' + g.schema_version + ')' : '') + '. Ask Jacques for the current file.';
  if (!Array.isArray(g.missions) || g.missions.length !== 90) return 'A game file needs exactly 90 daily missions.';
  for (var i = 0; i < 90; i++) { var m = g.missions[i]; if (!m || m.day !== i + 1 || !m.title) return 'Mission ' + (i + 1) + ' is missing or out of order.'; }
  if (!Array.isArray(g.support_cards)) return 'The game file has no support cards.';
  if (!Array.isArray(g.partners) || g.partners.length !== 2) return 'The game file needs two partners.';
  return null;
}
function cleanGame(g) {
  delete g.delivery; (g.partners || []).forEach(function (p) { delete p.email; delete p.contact; });
  if (!g.budget_plans || !g.budget_plans.length) g.budget_plans = [{ id: 'free', currency: 'USD', total_cap_minor: 0, allocations: [] }];
  return g;
}
$('#gameFile').onchange = function () {
  readFile(this, function (g) {
    var bad = validGame(g); if (bad) { toast(bad); return; }
    g = cleanGame(g);
    var go2 = function () {
      try { localStorage.setItem(GKEY, JSON.stringify(g)); } catch (e) { toast('This browser couldn’t store the game file. Try another browser.'); return; }
      var same = S.gameId === g.game_id; G = g;
      if (!same) { S = fresh(); }
      save(); ui.draft = null; ui.setupStep = 0; toast('Loaded: ' + g.title); go(S.settings ? 'hq' : 'setup');
    };
    if (S.settings && S.gameId !== g.game_id) confirmBox('Load ' + g.title + '?', 'This is a different game, so the current progress on this device will be erased. Download a backup first if you want to keep it.', 'Load and start fresh', go2);
    else go2();
  });
};
$('#backupFile').onchange = function () {
  readFile(this, function (j) {
    if (!j || j.kind !== 'oim-mission-backup' || !j.state) { toast('That isn’t a Mission Control backup.'); return; }
    if (j.game) { var bad = validGame(j.game); if (bad) { toast(bad); return; } }
    confirmBox('Restore this backup?', 'It will replace what’s on this device with the backup from ' + niceDate(todayStr(new Date(j.savedAt))) + '.', 'Restore', function () {
      try { if (j.game) localStorage.setItem(GKEY, JSON.stringify(cleanGame(j.game))); else localStorage.removeItem(GKEY); } catch (e) { toast('This browser couldn’t store the backup.'); return; }
      G = j.game || BUILTIN; S = j.state; if (!S.journal) S.journal = { partner_a: {}, partner_b: {} }; save(); toast('Backup restored.'); go(S.settings ? 'hq' : 'intro');
    });
  });
};

if (S.settings && G.game_id !== S.gameId && S.gameId) { G = BUILTIN; }
render();
})();
</script>
