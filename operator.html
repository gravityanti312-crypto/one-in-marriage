<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Mission Control · Operator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23122029' stroke='%23c6a765' stroke-width='4'/%3E%3Ctext x='32' y='43' font-family='Georgia' font-size='32' text-anchor='middle' fill='%23e2c98f'%3E1%3C/text%3E%3C/svg%3E" />
<style>
@font-face{font-family:'Lora';font-style:normal;font-weight:500 600;font-display:swap;src:url(assets/fonts/lora-latin.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-style:normal;font-weight:400 800;font-display:swap;src:url(assets/fonts/outfit-latin.woff2) format('woff2')}
:root{--cream:#faf6ee;--paper:#fffdf8;--ink:#2b2c26;--body:#5f635b;--muted:#7a7d74;--line:#e7e0d1;--sage:#7d9068;--sage-deep:#5f7350;--sage-soft:#e9efe1;--tan-soft:#efe6d5;--num:#8a6c3d;--gold:#c6a765;--night:#122029;--red:#b4553f}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,sans-serif;line-height:1.5;font-size:16px}
button,input,select{font:inherit;color:inherit}
.top{background:var(--night);color:#f3ecdc}
.top-in,.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.top-in{display:flex;align-items:center;gap:12px;min-height:62px}
.one{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-family:'Lora',Georgia,serif;color:#e2c98f;font-weight:600;flex:none}
.top b{font-weight:700}.top small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.top .sp{margin-left:auto}
.wrap{padding-top:26px;padding-bottom:60px}
h1,h2,h3{font-family:'Lora',Georgia,serif;font-weight:600;margin:0;line-height:1.2}
h1{font-size:30px}h2{font-size:22px}h3{font-size:18px}
.kicker{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--num)}
.muted{color:var(--body)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 22px rgba(60,54,38,.06);margin-top:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
.input{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:16px}
.input:focus{outline:2px solid var(--sage);outline-offset:1px}
.field{margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:10px 18px;min-height:44px;font-weight:700;font-size:15px;border:1.5px solid var(--line);background:#fff;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--sage);border-color:var(--sage);color:#fff}
.btn.dark{background:var(--night);border-color:var(--night);color:#f3ecdc}
.btn.sm{min-height:36px;padding:6px 13px;font-size:13.5px}
.btn.danger{color:var(--red);border-color:#e5c3b9}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{flex:1;min-width:150px;border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:#fff}
.seg input{accent-color:var(--sage);margin-right:6px}
.seg label:has(input:checked){border-color:var(--sage);background:var(--sage-soft)}
.pill{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--tan-soft);color:#7a5c2e}
.pill.ok{background:var(--sage-soft);color:var(--sage-deep)}
.couple{display:grid;gap:10px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media (max-width:560px){.who{grid-template-columns:1fr}}
.slot{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--cream)}
.slot b{display:block}
.linkbox{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;color:var(--body);background:#fff;border:1px dashed var(--line);border-radius:10px;padding:6px 8px;margin:6px 0 8px}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted)}
.err{color:var(--red);font-weight:600;margin-top:8px}
.toast{position:fixed;left:16px;right:16px;bottom:22px;display:flex;justify-content:center;pointer-events:none;z-index:9}
.toast div{background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-weight:600;box-shadow:0 14px 30px rgba(0,0,0,.25)}
details summary{cursor:pointer;font-weight:700;color:var(--sage-deep);margin-top:8px}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="top-in"><span class="one">1</span><span><b>Mission Control</b><small>Operator</small></span><button class="btn sm sp hidden" id="signOut">Sign out</button></div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<script>
(function () {
'use strict';
var API = 'mission-api.php';
var PW = sessionStorage.getItem('oim-op-pw') || '';
var couples = [], newGame = null, justMade = null;
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var tt; function toast(m) { var t = $('#toast'); t.innerHTML = '<div></div>'; t.firstChild.textContent = m; clearTimeout(tt); tt = setTimeout(function () { t.innerHTML = ''; }, 2800); }
function api(body) {
  body.pw = PW;
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), cache: 'no-store' })
    .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'The server sent an unexpected reply (' + r.status + ').' }; }); })
    .catch(function () { return { ok: false, error: 'No connection. Check your internet and try again.' }; });
}
function linkFor(k) { return new URL('game.html?k=' + k, location.href).href; }
function copy(text, msg) {
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast(msg); }, function () { prompt('Copy this:', text); });
  else prompt('Copy this:', text);
}
function message(c, slot) {
  var me = c.names[slot], other = c.names[slot === 'partner_a' ? 'partner_b' : 'partner_a'];
  return 'Hi ' + me + '! Here is your personal Mission Control link for your 90-day game:\n\n' + linkFor(c.keys[slot]) +
    '\n\nIt is just for you, so please don’t share it — ' + other + ' has their own. Open it on your phone and bookmark it.\n\nFirst step: choose Day 1 together and commit to your commitments on your own phone.\n\nJacques';
}
function niceDate(s) { if (!s) return ''; var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); }

/* ---------- login ---------- */
function vLogin(err) {
  $('#signOut').classList.add('hidden');
  $('#app').innerHTML = '<div class="card" style="max-width:440px;margin:30px auto 0"><div class="kicker">Operator login</div><h1 style="margin:6px 0 8px">Mission Control</h1><p class="muted" style="margin-top:0">For Jacques and the ONE in Marriage team. Uses the same team password as the survey responses page.</p>' +
    '<form id="lf"><label class="f" for="pw">Team password</label><div class="row" style="flex-wrap:nowrap"><input class="input" type="password" id="pw" autocomplete="current-password" required><button class="btn sm" type="button" id="show">Show</button></div>' +
    (err ? '<p class="err">' + esc(err) + '</p>' : '') + '<button class="btn primary" style="margin-top:14px;width:100%">Log in</button></form></div>';
  $('#show').onclick = function () { var i = $('#pw'); i.type = i.type === 'password' ? 'text' : 'password'; this.textContent = i.type === 'password' ? 'Show' : 'Hide'; };
  $('#lf').onsubmit = function (e) {
    e.preventDefault(); PW = $('#pw').value;
    api({ action: 'admin_login' }).then(function (r) { if (!r.ok) { PW = ''; vLogin(r.error); return; } sessionStorage.setItem('oim-op-pw', PW); sessionStorage.setItem('oim-operator', '1'); load(); });
  };
  $('#pw').focus();
}
$('#signOut').onclick = function () { sessionStorage.clear(); PW = ''; vLogin(); };

/* ---------- main ---------- */
function load() {
  api({ action: 'admin_list' }).then(function (r) {
    if (!r.ok) { if (/password|set up/i.test(r.error)) { sessionStorage.clear(); PW = ''; return vLogin(r.error); } toast(r.error); return; }
    couples = r.couples; render();
  });
}
function status(c) {
  if (c.started) return !c.open ? '<span class="pill ok">Starts ' + esc(niceDate(c.startDate)) + '</span>' : c.finished ? '<span class="pill ok">Complete — all 90 graded</span>' : '<span class="pill ok">On mission ' + c.day + ' of 90 · ' + c.graded + ' graded</span>';
  var n = (c.committed.partner_a ? 1 : 0) + (c.committed.partner_b ? 1 : 0);
  return '<span class="pill">' + (c.startDate ? 'Day 1 proposed: ' + esc(niceDate(c.startDate)) + ' · ' : '') + n + ' of 2 committed</span>';
}
function render() {
  $('#signOut').classList.remove('hidden');
  var h = '<div class="row" style="justify-content:space-between"><div><div class="kicker">Operator</div><h1 style="margin-top:4px">Couples</h1></div><div class="row"><button class="btn" id="testStarter">Test mode: starter game</button></div></div>';
  if (justMade) {
    var c = justMade;
    h += '<div class="card" style="border-color:var(--sage)"><div class="kicker">Created — send each partner their own link</div><h2 style="margin:4px 0 0">' + esc(c.names.partner_a) + ' &amp; ' + esc(c.names.partner_b) + '</h2>' + slotsHTML(c) + '<p class="muted" style="font-size:14px;margin-bottom:0">Each link opens the game as that person only. They can’t switch to their partner.</p></div>';
  }
  h += '<div class="card"><div class="kicker">New couple</div><h2 style="margin:4px 0 14px">Set up a game</h2>' +
    '<div class="field"><label class="f">Game</label><div class="seg"><label><input type="radio" name="gm" value="builtin"' + (newGame ? '' : ' checked') + '>Starter game — Operation ONE</label><label><input type="radio" name="gm" value="file"' + (newGame ? ' checked' : '') + '>Their personalized game file</label></div>' +
    '<div id="fileBox" class="' + (newGame ? '' : 'hidden') + '" style="margin-top:10px"><input type="file" id="gf" accept=".json,application/json"><div id="gInfo" class="muted" style="font-size:14px;margin-top:6px">' + (newGame ? 'Loaded: <b>' + esc(newGame.title) + '</b>' : 'Choose the couple’s .json game file.') + '</div></div></div>' +
    '<div class="grid2"><div class="field"><label class="f" for="na">Partner A</label><input class="input" id="na" maxlength="30" value="' + esc(newGame ? newGame.partners[0].display_name : '') + '" placeholder="First name"></div><div class="field"><label class="f" for="nb">Partner B</label><input class="input" id="nb" maxlength="30" value="' + esc(newGame ? newGame.partners[1].display_name : '') + '" placeholder="First name"></div></div>' +
    '<div class="grid2"><div class="field"><label class="f" for="bs">Target</label><select class="input" id="bs"><option value="A+B">A or B days</option><option value="A">A days only</option><option value="">No target yet</option></select></div><div class="field"><label class="f" for="tg">Number of days (1–90)</label><input class="input" type="number" id="tg" min="1" max="90" value="60"></div></div>' +
    (newGame && newGame.budget_plans && newGame.budget_plans.length > 1 ? '<div class="field"><label class="f" for="bp">Rewards budget</label><select class="input" id="bp">' + newGame.budget_plans.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.id) + (p.total_cap_minor ? ' — up to $' + (p.total_cap_minor / 100) : ' — $0') + '</option>'; }).join('') + '</select></div>' : '') +
    '<p class="muted" style="font-size:14px;margin-top:0">The couple chooses Day 1 and each partner commits on their own phone. The target is fixed once both have committed.</p>' +
    '<div class="row"><button class="btn primary" id="create">Create and get links</button>' + (newGame ? '<button class="btn sm" id="testNew">Test this game file first</button>' : '') + '</div><p class="err hidden" id="cErr"></p></div>';
  h += '<div style="margin-top:28px" class="row"><h2>All couples</h2><span class="pill">' + couples.length + '</span><button class="btn sm" id="refresh" style="margin-left:auto">Refresh</button></div>';
  h += couples.length ? couples.map(function (c) {
    return '<div class="card couple"><div class="row" style="justify-content:space-between"><div><h3>' + esc(c.names.partner_a) + ' &amp; ' + esc(c.names.partner_b) + '</h3><div class="muted" style="font-size:14px">' + esc(c.title) + (c.settings.target ? ' · target ' + c.settings.target + ' ' + (c.settings.basis === 'A' ? 'A' : 'A/B') + ' days' : '') + '</div></div>' + status(c) + '</div>' +
      slotsHTML(c) +
      '<div class="row"><button class="btn sm" data-test="' + c.id + '">Test mode with this game</button>' +
      '<details style="flex-basis:100%"><summary>More</summary><div class="row" style="margin-top:10px"><button class="btn sm" data-relink="' + c.id + ':partner_a">New link for ' + esc(c.names.partner_a) + '</button><button class="btn sm" data-relink="' + c.id + ':partner_b">New link for ' + esc(c.names.partner_b) + '</button><button class="btn sm danger" data-remove="' + c.id + '">Remove couple</button></div><p class="muted" style="font-size:13px;margin-bottom:0">A new link stops the old one working (use it if a link was shared by mistake). Removing hides the couple; their data is kept on the server.</p></details></div></div>';
  }).join('') : '<div class="empty" style="margin-top:12px">No couples yet. Set one up above.</div>';
  $('#app').innerHTML = h;
  wire();
}
function slotsHTML(c) {
  return '<div class="who">' + ['partner_a', 'partner_b'].map(function (s) {
    return '<div class="slot"><b>' + esc(c.names[s]) + (c.committed && c.committed[s] ? ' <span class="pill ok">committed</span>' : '') + '</b><div class="linkbox">' + esc(linkFor(c.keys[s])) + '</div><div class="row"><button class="btn sm" data-copy="' + c.id + ':' + s + '">Copy link</button><button class="btn sm" data-msg="' + c.id + ':' + s + '">Copy text message</button></div></div>';
  }).join('') + '</div>';
}
function find(id) { if (justMade && justMade.id === id) return justMade; return couples.filter(function (c) { return c.id === id; })[0]; }
function wire() {
  [].forEach.call(document.querySelectorAll('[name=gm]'), function (r) { r.onchange = function () { $('#fileBox').classList.toggle('hidden', r.value !== 'file' || !r.checked); if (r.value === 'builtin' && r.checked && newGame) { newGame = null; render(); } }; });
  if ($('#gf')) $('#gf').onchange = function () {
    var f = this.files[0]; if (!f) return; var rd = new FileReader();
    rd.onload = function () {
      var g; try { g = JSON.parse(rd.result); } catch (e) { $('#gInfo').textContent = 'That file isn’t valid JSON.'; return; }
      if (['1.0.0', '2.0.0', '2.1.0'].indexOf(g.schema_version) < 0 || !Array.isArray(g.missions) || g.missions.length !== 90 || !Array.isArray(g.partners) || g.partners.length !== 2) { $('#gInfo').textContent = 'That doesn’t look like a complete 90-day game file.'; return; }
      newGame = g; render();
    };
    rd.readAsText(f);
  };
  $('#create').onclick = function () {
    var gm = document.querySelector('[name=gm]:checked').value, err = $('#cErr');
    if (gm === 'file' && !newGame) { err.textContent = 'Choose the game file first.'; err.classList.remove('hidden'); return; }
    var body = { action: 'admin_create', names: { partner_a: $('#na').value.trim(), partner_b: $('#nb').value.trim() }, game: gm === 'file' ? newGame : null,
      basis: $('#bs').value || null, target: $('#bs').value ? +$('#tg').value : null, budget: $('#bp') ? $('#bp').value : 'free' };
    this.disabled = true; var btn = this;
    api(body).then(function (r) {
      btn.disabled = false;
      if (!r.ok) { err.textContent = r.error; err.classList.remove('hidden'); return; }
      justMade = r.couple; newGame = null; toast('Created. Send each partner their link.'); load(); window.scrollTo(0, 0);
    });
  };
  if ($('#testNew')) $('#testNew').onclick = function () { startTest(newGame, { partner_a: $('#na').value.trim() || newGame.partners[0].display_name, partner_b: $('#nb').value.trim() || newGame.partners[1].display_name }, { basis: 'A+B', target: 60 }); };
  $('#testStarter').onclick = function () { startTest(null, { partner_a: 'Alex', partner_b: 'Jordan' }, { basis: 'A+B', target: 60 }); };
  $('#refresh').onclick = function () { justMade = null; load(); };
  [].forEach.call(document.querySelectorAll('[data-copy]'), function (b) { b.onclick = function () { var p = b.getAttribute('data-copy').split(':'), c = find(p[0]); copy(linkFor(c.keys[p[1]]), 'Link for ' + c.names[p[1]] + ' copied.'); }; });
  [].forEach.call(document.querySelectorAll('[data-msg]'), function (b) { b.onclick = function () { var p = b.getAttribute('data-msg').split(':'), c = find(p[0]); copy(message(c, p[1]), 'Message for ' + c.names[p[1]] + ' copied — paste it into a text.'); }; });
  [].forEach.call(document.querySelectorAll('[data-test]'), function (b) { b.onclick = function () { var c = find(b.getAttribute('data-test')); api({ action: 'admin_game', id: c.id }).then(function (r) { if (!r.ok) return toast(r.error); startTest(r.game, r.names, r.settings); }); }; });
  [].forEach.call(document.querySelectorAll('[data-relink]'), function (b) { b.onclick = function () { var p = b.getAttribute('data-relink').split(':'), c = find(p[0]); if (!confirm('Make a new link for ' + c.names[p[1]] + '? Their old link will stop working.')) return; api({ action: 'admin_relink', id: p[0], slot: p[1] }).then(function (r) { if (!r.ok) return toast(r.error); justMade = r.couple; toast('New link made. Send it to ' + c.names[p[1]] + '.'); load(); window.scrollTo(0, 0); }); }; });
  [].forEach.call(document.querySelectorAll('[data-remove]'), function (b) { b.onclick = function () { var c = find(b.getAttribute('data-remove')); if (!confirm('Remove ' + c.names.partner_a + ' & ' + c.names.partner_b + '? Their links stop working. Their data is kept on the server.')) return; api({ action: 'admin_remove', id: c.id }).then(function (r) { if (!r.ok) return toast(r.error); if (justMade && justMade.id === c.id) justMade = null; toast('Removed.'); load(); }); }; });
}
function startTest(game, names, settings) {
  try {
    sessionStorage.setItem('oim-operator', '1');
    if (game) sessionStorage.setItem('oim-test-game', JSON.stringify(game)); else sessionStorage.removeItem('oim-test-game');
    sessionStorage.setItem('oim-test-names', JSON.stringify(names));
    sessionStorage.setItem('oim-test-settings', JSON.stringify({ basis: settings.basis || null, target: settings.target || null, budget: settings.budget || 'free' }));
  } catch (e) { toast('This browser couldn’t hold the test game.'); return; }
  location.href = 'game.html?test=1';
}
if (PW) load(); else vLogin();
})();
</script>
</body>
</html>
