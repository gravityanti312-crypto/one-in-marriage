<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Mission Control · Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23122029' stroke='%23c6a765' stroke-width='4'/%3E%3Ctext x='32' y='43' font-family='Georgia' font-size='32' text-anchor='middle' fill='%23e2c98f'%3E1%3C/text%3E%3C/svg%3E" />
<style>
@font-face{font-family:'Lora';font-style:normal;font-weight:500 600;font-display:swap;src:url(assets/fonts/lora-latin.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-style:normal;font-weight:400 800;font-display:swap;src:url(assets/fonts/outfit-latin.woff2) format('woff2')}
:root{--cream:#faf6ee;--paper:#fffdf8;--ink:#2b2c26;--body:#5f635b;--muted:#7a7d74;--line:#e7e0d1;--sage:#7d9068;--sage-deep:#5f7350;--sage-soft:#e9efe1;--tan-soft:#efe6d5;--num:#8a6c3d;--gold:#c6a765;--night:#122029;--red:#b4553f}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,sans-serif;line-height:1.5;font-size:16px}
button,input,select{font:inherit;color:inherit}
.top{background:var(--night);color:#f3ecdc;position:sticky;top:0;z-index:5}
.top-in,.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.top-in{display:flex;align-items:center;gap:12px;min-height:62px}
.one{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-family:'Lora',Georgia,serif;color:#e2c98f;font-weight:600;flex:none}
.top b{font-weight:700}.top small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.top .sp{margin-left:auto}
.top .btn{background:transparent;color:#f3ecdc;border-color:rgba(255,255,255,.25)}
.wrap{padding-top:24px;padding-bottom:70px}
h1,h2,h3{font-family:'Lora',Georgia,serif;font-weight:600;margin:0;line-height:1.2}
h1{font-size:30px}h2{font-size:22px}h3{font-size:18px}
.kicker{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--num)}
.muted{color:var(--body)}.small{font-size:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 22px rgba(60,54,38,.06);margin-top:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
.input{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:16px}
.input:focus{outline:2px solid var(--sage);outline-offset:1px}
.field{margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:10px 18px;min-height:44px;font-weight:700;font-size:15px;border:1.5px solid var(--line);background:#fff;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--sage);border-color:var(--sage);color:#fff}
.btn.dark{background:var(--night);border-color:var(--night);color:#f3ecdc}
.btn.sm{min-height:36px;padding:6px 13px;font-size:13.5px}
.btn.danger{color:var(--red);border-color:#e5c3b9}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{flex:1;min-width:160px;border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:#fff}
.seg input{accent-color:var(--sage);margin-right:6px}
.seg label:has(input:checked){border-color:var(--sage);background:var(--sage-soft)}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--sage);margin:2px 0 0;flex:none}
.pill{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--tan-soft);color:#7a5c2e}
.pill.ok{background:var(--sage-soft);color:var(--sage-deep)}
.pill.bad{background:#f6e2dc;color:var(--red)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media (max-width:600px){.who{grid-template-columns:1fr}}
.slot{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--cream)}
.slot b{display:block}
.linkbox{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;color:var(--body);background:#fff;border:1px dashed var(--line);border-radius:10px;padding:6px 8px;margin:6px 0 8px}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted)}
.err{color:var(--red);font-weight:600;margin-top:8px}
.toast{position:fixed;left:16px;right:16px;bottom:22px;display:flex;justify-content:center;pointer-events:none;z-index:9}
.toast div{background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-weight:600;box-shadow:0 14px 30px rgba(0,0,0,.25)}
details summary{cursor:pointer;font-weight:700;color:var(--sage-deep);margin-top:8px}
.hidden{display:none!important}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
@media (max-width:700px){.flow{grid-template-columns:1fr}}
.flow div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
.flow b{display:flex;align-items:center;gap:8px;font-size:14.5px}
.flow i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--sage);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.flow span{display:block;font-size:13px;color:var(--body);margin-top:4px}
.flow .here{border-color:var(--sage);background:var(--sage-soft)}
.srow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.tabs{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--night);border-color:var(--night);color:#f3ecdc}
</style>
</head>
<body>
<header class="top"><div class="top-in"><span class="one">1</span><span><b>Mission Control</b><small>Admin</small></span><button class="btn sm sp hidden" id="signOut">Sign out</button></div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<script>
(function () {
'use strict';
var API = 'mission-api.php';
var PW = sessionStorage.getItem('oim-op-pw') || '';
var couples = [], surveys = [], mailReady = null, newGame = null, prefill = null, justMade = null, tab = 'games';
function $(s) { return document.querySelector(s); }
function $$(s) { return [].slice.call(document.querySelectorAll(s)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
/* A copy of the site in a subfolder (like /dev2/) is for testing: say so on every screen. */
(function () { var d = location.pathname.replace(/[^\/]*$/, ''); if (d === '/') return; var b = document.createElement('div'); b.textContent = 'TEST COPY (' + d.replace(/\//g, ' ').trim() + ') · couples made here are separate from the live site'; b.style.cssText = 'background:#b4553f;color:#fff;font:700 13px/1.4 system-ui,sans-serif;text-align:center;padding:8px 12px'; document.body.insertBefore(b, document.body.firstChild); })();
var tt; function toast(m) { var t = $('#toast'); t.innerHTML = '<div></div>'; t.firstChild.textContent = m; clearTimeout(tt); tt = setTimeout(function () { t.innerHTML = ''; }, 3400); }
function api(body) {
  body.pw = PW;
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), cache: 'no-store' })
    .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'The server sent an unexpected reply (' + r.status + ').' }; }); })
    .catch(function () { return { ok: false, error: 'No connection. Check your internet and try again.' }; });
}
function linkFor(k) { return new URL('game.html?k=' + k, location.href).href; }
function copy(text, msg) {
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast(msg); }, function () { prompt('Copy this:', text); });
  else prompt('Copy this:', text);
}
function message(c, slot) {
  var me = c.names[slot], other = c.names[slot === 'partner_a' ? 'partner_b' : 'partner_a'];
  return 'Hi ' + me + '! Here is your personal Mission Control link for your 90-day game:\n\n' + linkFor(c.keys[slot]) +
    '\n\nIt is your own login, so please don’t share it — ' + other + ' has their own. Open it on your phone and bookmark it.\n\nFirst step: choose Day 1 together and commit to your commitments on your own phone.\n\nJacques';
}
function niceDate(s) { if (!s) return ''; var p = s.slice(0, 10).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); }
function when(iso) { try { var d = new Date(iso); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); } catch (e) { return ''; } }
function download(name, text) { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/markdown' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

/* ---------- login ---------- */
function vLogin(err) {
  $('#signOut').classList.add('hidden');
  $('#app').innerHTML = '<div class="card" style="max-width:440px;margin:30px auto 0"><div class="kicker">Admin login</div><h1 style="margin:6px 0 8px">Mission Control</h1><p class="muted" style="margin-top:0">For Jacques and the ONE in Marriage team. Use the same team password as the survey responses page.</p>' +
    '<form id="lf"><label class="f" for="pw">Team password</label><div class="row" style="flex-wrap:nowrap"><input class="input" type="password" id="pw" autocomplete="current-password" required><button class="btn sm" type="button" id="show">Show</button></div>' +
    (err ? '<p class="err">' + esc(err) + '</p>' : '') + '<button class="btn primary" style="margin-top:14px;width:100%">Log in</button></form></div>';
  $('#show').onclick = function () { var i = $('#pw'); i.type = i.type === 'password' ? 'text' : 'password'; this.textContent = i.type === 'password' ? 'Show' : 'Hide'; };
  $('#lf').onsubmit = function (e) {
    e.preventDefault(); PW = $('#pw').value;
    api({ action: 'admin_login' }).then(function (r) { if (!r.ok) { PW = ''; vLogin(r.error); return; } sessionStorage.setItem('oim-op-pw', PW); sessionStorage.setItem('oim-operator', '1'); load(); });
  };
  $('#pw').focus();
}
$('#signOut').onclick = function () { sessionStorage.clear(); PW = ''; vLogin(); };

/* ---------- data ---------- */
function load() {
  Promise.all([api({ action: 'admin_list' }), api({ action: 'admin_surveys' })]).then(function (rs) {
    var r = rs[0];
    if (!r.ok) { if (/password|set up/i.test(r.error)) { sessionStorage.clear(); PW = ''; return vLogin(r.error); } toast(r.error); return; }
    couples = r.couples; surveys = rs[1].ok ? rs[1].couples : []; mailReady = rs[1].ok ? rs[1].mail : null; render();
  });
}
function status(c) {
  if (c.started) return !c.open ? '<span class="pill ok">Starts ' + esc(niceDate(c.startDate)) + '</span>' : c.finished ? '<span class="pill ok">Complete — all 90 graded</span>' : '<span class="pill ok">On mission ' + c.day + ' of 90 · ' + c.graded + ' graded</span>';
  var n = (c.committed.partner_a ? 1 : 0) + (c.committed.partner_b ? 1 : 0);
  return '<span class="pill">' + (c.startDate ? 'Day 1 proposed: ' + esc(niceDate(c.startDate)) + ' · ' : '') + n + ' of 2 committed</span>';
}
function inviteLine(c, s) {
  var inv = c.invites && c.invites[s], em = c.emails && c.emails[s];
  if (!em) return '<span class="pill">No email — copy the link</span>';
  if (!inv) return '<span class="pill">Not emailed yet</span>';
  return inv.ok ? '<span class="pill ok">✉️ Emailed ' + esc(when(inv.at)) + '</span>' : '<span class="pill bad">Email failed ' + esc(when(inv.at)) + '</span>';
}
function slotsHTML(c) {
  return '<div class="who">' + ['partner_a', 'partner_b'].map(function (s) {
    var em = c.emails && c.emails[s];
    return '<div class="slot"><b>' + esc(c.names[s]) + (c.committed && c.committed[s] ? ' <span class="pill ok">committed</span>' : '') + '</b><div class="muted small">' + (em ? esc(em) : 'No email on file') + '</div>' +
      '<div style="margin-top:6px">' + inviteLine(c, s) + '</div><div class="linkbox">' + esc(linkFor(c.keys[s])) + '</div>' +
      '<div class="row">' + (em ? '<button class="btn sm primary" data-invite="' + c.id + ':' + s + '">' + (c.invites && c.invites[s] ? 'Email again' : 'Email invitation') + '</button>' : '') + '<button class="btn sm" data-copy="' + c.id + ':' + s + '">Copy link</button><button class="btn sm" data-msg="' + c.id + ':' + s + '">Copy text message</button></div></div>';
  }).join('') + '</div>';
}

/* ---------- render ---------- */
function render() {
  $('#signOut').classList.remove('hidden');
  var ready = surveys.filter(function (s) { return !s.hasGame; });
  var h = '<div class="row" style="justify-content:space-between"><div><div class="kicker">Admin</div><h1 style="margin-top:4px">Mission Control</h1></div><div class="row"><button class="btn" id="testStarter">Test mode: starter game</button></div></div>';
  h += '<details class="card"' + (couples.length ? '' : ' open') + '><summary style="margin:0">How it works \u2014 survey to game in 5 steps</summary><div class="flow"><div><b><i>1</i>Survey</b><span>Each partner fills in THE 90 survey on their phone.</span></div><div class="' + (ready.length ? 'here' : '') + '"><b><i>2</i>Couple file</b><span>When both finish, they appear under “Finished surveys”. Download the couple file.</span></div><div><b><i>3</i>Game creator</b><span>Run the couple file through the game-creator skill. It makes the game JSON.</span></div><div><b><i>4</i>Upload here</b><span>“Set up their game”, choose the JSON, create.</span></div><div><b><i>5</i>Invitations</b><span>Each partner is emailed their own login link.</span></div></div></details>';
  if (mailReady === false) h += '<div class="card" style="border-color:#e5c3b9"><b>Email isn’t available on this server.</b> <span class="muted">Games still work — copy each link and text it instead.</span></div>';
  if (justMade) {
    var c = justMade;
    h += '<div class="card" style="border-color:var(--sage)"><div class="kicker">Ready — each partner has their own login</div><h2 style="margin:4px 0 0">' + esc(c.names.partner_a) + ' &amp; ' + esc(c.names.partner_b) + '</h2>' + slotsHTML(c) + '<p class="muted small" style="margin-bottom:0">Each link opens the game as that person only. They can’t switch to their partner.</p></div>';
  }
  h += '<div class="tabs" role="group"><button data-tab="games" aria-pressed="' + (tab === 'games') + '">Games (' + couples.length + ')</button><button data-tab="surveys" aria-pressed="' + (tab === 'surveys') + '">Finished surveys (' + ready.length + ' waiting)</button><button data-tab="new" aria-pressed="' + (tab === 'new') + '">+ New game</button></div>';
  if (tab === 'surveys') h += surveysHTML();
  else if (tab === 'new') h += newHTML();
  else h += gamesHTML();
  $('#app').innerHTML = h;
  wire();
}
function surveysHTML() {
  var h = '<div class="card"><div class="kicker">Finished surveys</div><h2 style="margin:4px 0 6px">Couples where both partners finished</h2><p class="muted small" style="margin-top:0">Newest first. Download the couple file for the game creator, then set up their game here. The full answers and spreadsheet stay on <a href="responses.php">the survey responses page</a>.</p>';
  if (!surveys.length) h += '<div class="empty">No completed couples yet. Each partner fills in the survey from <a href="links.html">the links page</a>; when both have finished they appear here.</div>';
  else h += surveys.map(function (s, i) {
    return '<div class="srow"><div><b>' + esc(s.a.first + ' ' + s.a.last) + ' &amp; ' + esc(s.b.first + ' ' + s.b.last) + '</b> ' + (s.hasGame ? '<span class="pill ok">Game created</span>' : '<span class="pill">Needs a game</span>') +
      '<div class="muted small">' + esc(s.program) + ' · finished ' + esc(when(s.a.at > s.b.at ? s.a.at : s.b.at)) + '</div></div><div class="row">' +
      (s.file ? '<button class="btn sm" data-sfile="' + i + '">Download couple file</button>' : '') + (s.hasGame ? '' : '<button class="btn sm primary" data-setup="' + i + '">Set up their game →</button>') + '</div></div>';
  }).join('');
  return h + '</div>';
}
function newHTML() {
  var P = prefill || {}, gA = newGame && newGame.partners[0], gB = newGame && newGame.partners[1];
  var nA = P.na || (gA && gA.display_name) || '', nB = P.nb || (gB && gB.display_name) || '';
  var eA = P.ea || (gA && gA.email) || '', eB = P.eb || (gB && gB.email) || '';
  return '<div class="card"><div class="kicker">New game</div><h2 style="margin:4px 0 14px">' + (P.label ? 'Set up a game for ' + esc(P.label) : 'Set up a game') + '</h2>' +
    '<div class="field"><label class="f">Game</label><div class="seg"><label><input type="radio" name="gm" value="file"' + (newGame || P.label ? ' checked' : '') + '>Their game file (.json from the game creator)</label><label><input type="radio" name="gm" value="builtin"' + (newGame || P.label ? '' : ' checked') + '>Starter game — Operation ONE</label></div>' +
    '<div id="fileBox" class="' + (newGame || P.label ? '' : 'hidden') + '" style="margin-top:10px"><input type="file" id="gf" accept=".json,application/json"><div id="gInfo" class="muted small" style="margin-top:6px">' + (newGame ? 'Loaded: <b>' + esc(newGame.title) + '</b> — ' + newGame.missions.length + ' missions' : 'Choose the couple’s .json game file.') + '</div></div></div>' +
    '<div class="grid2"><div class="field"><label class="f" for="na">Partner A — first name</label><input class="input" id="na" maxlength="30" value="' + esc(nA) + '"></div><div class="field"><label class="f" for="ea">Partner A — email</label><input class="input" id="ea" type="email" value="' + esc(eA) + '" placeholder="For their invitation"></div></div>' +
    '<div class="grid2"><div class="field"><label class="f" for="nb">Partner B — first name</label><input class="input" id="nb" maxlength="30" value="' + esc(nB) + '"></div><div class="field"><label class="f" for="eb">Partner B — email</label><input class="input" id="eb" type="email" value="' + esc(eB) + '" placeholder="For their invitation"></div></div>' +
    '<div class="grid2"><div class="field"><label class="f" for="bs">Target</label><select class="input" id="bs"><option value="A+B">A or B days</option><option value="A">A days only</option><option value="">No target yet</option></select></div><div class="field"><label class="f" for="tg">Number of days (1–90)</label><input class="input" type="number" id="tg" min="1" max="90" value="60"></div></div>' +
    (newGame && newGame.budget_plans && newGame.budget_plans.length > 1 ? '<div class="field"><label class="f" for="bp">Rewards budget</label><select class="input" id="bp">' + newGame.budget_plans.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.id) + (p.total_cap_minor ? ' — up to $' + (p.total_cap_minor / 100) : ' — $0') + '</option>'; }).join('') + '</select></div>' : '') +
    '<label class="check"><input type="checkbox" id="send" checked><span><b>Email each partner their personal login link now</b><span class="muted small" style="display:block">You can also send or resend later from the Games tab.</span></span></label>' +
    '<div class="row" style="margin-top:16px"><button class="btn primary" id="create">Create the game</button><button class="btn sm" id="testNew"' + (newGame ? '' : ' disabled') + '>Test this game file first</button></div><p class="err hidden" id="cErr"></p></div>';
}
function gamesHTML() {
  if (!couples.length) return '<div class="empty" style="margin-top:16px">No games yet. Start from <b>Finished surveys</b> or <b>+ New game</b>.</div>';
  return '<div class="row" style="justify-content:space-between;align-items:center;margin:14px 0 2px"><span class="muted small">' + couples.length + ' game' + (couples.length === 1 ? '' : 's') + ' · ' + (couples.length * 2) + ' personal links</span><button class="btn sm" id="copyAll">Copy all links</button></div>' +
    couples.map(function (c) {
    return '<div class="card"><div class="row" style="justify-content:space-between"><div><h3>' + esc(c.names.partner_a) + ' &amp; ' + esc(c.names.partner_b) + '</h3><div class="muted small">' + esc(c.title) + (c.settings.target ? ' · target ' + c.settings.target + ' ' + (c.settings.basis === 'A' ? 'A' : 'A/B') + ' days' : '') + ' · created ' + esc(new Date(c.created).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })) + '</div></div>' + status(c) + '</div>' +
      slotsHTML(c) +
      '<div class="row" style="margin-top:12px"><button class="btn sm" data-test="' + c.id + '">Test mode with this game</button></div>' +
      '<details><summary>More</summary><div class="grid2" style="margin-top:10px"><div class="field"><label class="f">' + esc(c.names.partner_a) + '’s email</label><input class="input" data-em="' + c.id + ':partner_a" type="email" value="' + esc((c.emails || {}).partner_a || '') + '"></div><div class="field"><label class="f">' + esc(c.names.partner_b) + '’s email</label><input class="input" data-em="' + c.id + ':partner_b" type="email" value="' + esc((c.emails || {}).partner_b || '') + '"></div></div>' +
      '<div class="row"><button class="btn sm" data-saveem="' + c.id + '">Save emails</button><button class="btn sm" data-relink="' + c.id + ':partner_a">New link for ' + esc(c.names.partner_a) + '</button><button class="btn sm" data-relink="' + c.id + ':partner_b">New link for ' + esc(c.names.partner_b) + '</button><button class="btn sm danger" data-remove="' + c.id + '">Remove game</button></div>' +
      '<p class="muted" style="font-size:13px;margin-bottom:0">A new link stops the old one working (use it if a link was forwarded by mistake) and emails the new one if there’s an address. Removing hides the game; its data is kept on the server.</p></details></div>';
  }).join('');
}
/** Every partner's personal link, grouped by couple, ready to paste into notes. */
function allLinks() {
  return 'ONE in Marriage — game links\nEach link logs in as that person. Send each person only their own.\n\n' +
    couples.map(function (c) {
      return c.names.partner_a + ' & ' + c.names.partner_b + '\n' +
        c.names.partner_a + ': ' + linkFor(c.keys.partner_a) + '\n' +
        c.names.partner_b + ': ' + linkFor(c.keys.partner_b);
    }).join('\n\n');
}
function find(id) { if (justMade && justMade.id === id) return justMade; return couples.filter(function (c) { return c.id === id; })[0]; }
function afterSend(r, who) {
  var bad = Object.keys(r.sent || {}).filter(function (s) { return !r.sent[s].ok; });
  if (bad.length) toast(r.sent[bad[0]].error); else if (Object.keys(r.sent || {}).length) toast('Invitation' + (Object.keys(r.sent).length > 1 ? 's' : '') + ' emailed' + (who ? ' to ' + who : '') + '.');
}

/* ---------- wiring ---------- */
function wire() {
  $$('[data-tab]').forEach(function (b) { b.onclick = function () { tab = b.getAttribute('data-tab'); if (tab !== 'new') { prefill = null; } render(); }; });
  $('#testStarter').onclick = function () { startTest(null, { partner_a: 'Alex', partner_b: 'Jordan' }, { basis: 'A+B', target: 60 }); };
  $$('[data-sfile]').forEach(function (b) { b.onclick = function () { var s = surveys[+b.getAttribute('data-sfile')]; api({ action: 'admin_survey_file', file: s.file }).then(function (r) { if (!r.ok) return toast(r.error); download(r.name, r.text); }); }; });
  $$('[data-setup]').forEach(function (b) { b.onclick = function () { var s = surveys[+b.getAttribute('data-setup')]; prefill = { na: s.a.first, nb: s.b.first, ea: s.a.email, eb: s.b.email, label: s.a.first + ' & ' + s.b.first }; newGame = null; tab = 'new'; render(); window.scrollTo(0, 0); }; });
  $$('[name=gm]').forEach(function (r) { r.onchange = function () { $('#fileBox').classList.toggle('hidden', !(r.value === 'file' && r.checked)); if (r.value === 'builtin' && r.checked && newGame) { newGame = null; render(); } }; });
  if ($('#gf')) $('#gf').onchange = function () {
    var f = this.files[0]; if (!f) return; var rd = new FileReader();
    rd.onload = function () {
      var g; try { g = JSON.parse(rd.result); } catch (e) { $('#gInfo').textContent = 'That file isn’t valid JSON.'; return; }
      if (['1.0.0', '2.0.0', '2.1.0', '2.2.0'].indexOf(g.schema_version) < 0) { $('#gInfo').textContent = 'This game file is version ' + (g.schema_version || '(none)') + '. The site reads versions 1.0.0, 2.0.0, 2.1.0 and 2.2.0. Send the file to Ryan so the game can be updated for it.'; return; }
      if (!Array.isArray(g.missions) || g.missions.length !== 90 || !Array.isArray(g.partners) || g.partners.length !== 2) { $('#gInfo').textContent = 'That doesn’t look like a complete 90-day game file.'; return; }
      var keep = { na: $('#na').value.trim(), nb: $('#nb').value.trim(), ea: $('#ea').value.trim(), eb: $('#eb').value.trim(), label: prefill && prefill.label };
      newGame = g; prefill = { na: keep.na || g.partners[0].display_name, nb: keep.nb || g.partners[1].display_name, ea: keep.ea || g.partners[0].email || '', eb: keep.eb || g.partners[1].email || '', label: keep.label }; render();
    };
    rd.readAsText(f);
  };
  if ($('#create')) $('#create').onclick = function () {
    var gm = document.querySelector('[name=gm]:checked').value, err = $('#cErr');
    var show = function (m) { err.textContent = m; err.classList.remove('hidden'); };
    if (gm === 'file' && !newGame) return show('Choose the game file first.');
    var send = $('#send').checked, ea = $('#ea').value.trim(), eb = $('#eb').value.trim();
    if (send && (!ea || !eb) && !confirm('One or both emails are blank, so only partners with an email will be invited. Continue?')) return;
    var body = { action: 'admin_create', names: { partner_a: $('#na').value.trim(), partner_b: $('#nb').value.trim() }, emails: { partner_a: ea, partner_b: eb }, send: send, game: gm === 'file' ? newGame : null,
      basis: $('#bs').value || null, target: $('#bs').value ? +$('#tg').value : null, budget: $('#bp') ? $('#bp').value : 'free' };
    this.disabled = true; var btn = this;
    api(body).then(function (r) {
      btn.disabled = false;
      if (!r.ok) return show(r.error);
      justMade = r.couple; newGame = null; prefill = null; tab = 'games';
      if (send) afterSend(r); else toast('Created. Send each partner their link.');
      load(); window.scrollTo(0, 0);
    });
  };
  if ($('#testNew')) $('#testNew').onclick = function () { if (!newGame) return; startTest(newGame, { partner_a: $('#na').value.trim() || newGame.partners[0].display_name, partner_b: $('#nb').value.trim() || newGame.partners[1].display_name }, { basis: 'A+B', target: 60 }); };
  $$('[data-invite]').forEach(function (b) { b.onclick = function () { var p = b.getAttribute('data-invite').split(':'), c = find(p[0]); b.disabled = true; api({ action: 'admin_invite', id: p[0], slots: [p[1]] }).then(function (r) { b.disabled = false; if (!r.ok) return toast(r.error); if (justMade && justMade.id === p[0]) justMade = r.couple; afterSend(r, c.names[p[1]]); load(); }); }; });
  if ($('#copyAll')) $('#copyAll').onclick = function () { copy(allLinks(), 'All ' + (couples.length * 2) + ' links copied — paste them anywhere.'); };
  $$('[data-copy]').forEach(function (b) { b.onclick = function () { var p = b.getAttribute('data-copy').split(':'), c = find(p[0]); copy(linkFor(c.keys[p[1]]), 'Link for ' + c.names[p[1]] + ' copied.'); }; });
  $$('[data-msg]').forEach(function (b) { b.onclick = function () { var p = b.getAttribute('data-msg').split(':'), c = find(p[0]); copy(message(c, p[1]), 'Message for ' + c.names[p[1]] + ' copied — paste it into a text.'); }; });
  $$('[data-test]').forEach(function (b) { b.onclick = function () { var c = find(b.getAttribute('data-test')); api({ action: 'admin_game', id: c.id }).then(function (r) { if (!r.ok) return toast(r.error); startTest(r.game, r.names, r.settings); }); }; });
  $$('[data-saveem]').forEach(function (b) { b.onclick = function () { var id = b.getAttribute('data-saveem'); var em = { partner_a: document.querySelector('[data-em="' + id + ':partner_a"]').value.trim(), partner_b: document.querySelector('[data-em="' + id + ':partner_b"]').value.trim() }; api({ action: 'admin_update', id: id, emails: em }).then(function (r) { if (!r.ok) return toast(r.error); toast('Emails saved.'); load(); }); }; });
  $$('[data-relink]').forEach(function (b) { b.onclick = function () { var p = b.getAttribute('data-relink').split(':'), c = find(p[0]); if (!confirm('Make a new link for ' + c.names[p[1]] + '? Their old link stops working' + (c.emails && c.emails[p[1]] ? ' and the new one is emailed to ' + c.emails[p[1]] : '') + '.')) return; api({ action: 'admin_relink', id: p[0], slot: p[1], send: true }).then(function (r) { if (!r.ok) return toast(r.error); justMade = r.couple; if (Object.keys(r.sent || {}).length) afterSend(r, c.names[p[1]]); else toast('New link made. Send it to ' + c.names[p[1]] + '.'); load(); window.scrollTo(0, 0); }); }; });
  $$('[data-remove]').forEach(function (b) { b.onclick = function () { var c = find(b.getAttribute('data-remove')); if (!confirm('Remove ' + c.names.partner_a + ' & ' + c.names.partner_b + '’s game? Their links stop working. Their data is kept on the server.')) return; api({ action: 'admin_remove', id: c.id }).then(function (r) { if (!r.ok) return toast(r.error); if (justMade && justMade.id === c.id) justMade = null; toast('Removed.'); load(); }); }; });
}
function startTest(game, names, settings) {
  try {
    sessionStorage.setItem('oim-operator', '1');
    if (game) sessionStorage.setItem('oim-test-game', JSON.stringify(game)); else sessionStorage.removeItem('oim-test-game');
    sessionStorage.setItem('oim-test-names', JSON.stringify(names));
    sessionStorage.setItem('oim-test-settings', JSON.stringify({ basis: settings.basis || null, target: settings.target || null, budget: settings.budget || 'free' }));
  } catch (e) { toast('This browser couldn’t hold the test game.'); return; }
  location.href = 'game.html?test=1';
}
if (PW) load(); else vLogin();
})();
</script>
</body>
</html>
