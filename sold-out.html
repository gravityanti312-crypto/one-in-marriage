<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>November Is Full — ONE in Marriage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--cream:#faf6ee;--ink:#2b2c26;--body:#5f635b;--sage:#7d9068;--sage-deep:#5f7350;--tan:#a9824f;--tan-soft:#efe6d5;--line:#e7e0d1;--shadow:0 22px 55px rgba(60,54,38,.13)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;background:var(--cream);color:var(--ink);font-family:'Outfit',system-ui,Arial,sans-serif;line-height:1.6}
    .card{max-width:560px;text-align:center;background:#fffdf8;border:1px solid var(--line);border-radius:26px;padding:48px 40px;box-shadow:var(--shadow)}
    .mark{width:66px;height:66px;margin:0 auto 22px;display:grid;place-items:center;border-radius:50%;background:var(--tan-soft);color:var(--sage-deep)}
    .mark svg{width:32px;height:32px}
    .eyebrow{margin:0 0 12px;color:var(--tan);font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0;font-family:'Lora',Georgia,serif;font-weight:600;font-size:clamp(1.9rem,4vw,2.6rem);letter-spacing:-.01em}
    p{margin:16px 0 0;color:var(--body);font-size:1.05rem}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 26px;margin-top:28px;border-radius:999px;background:var(--sage);color:#fff;font-weight:600;text-decoration:none;transition:180ms ease}
    .btn:hover{background:var(--sage-deep);transform:translateY(-2px)}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></div>
    <p class="eyebrow">November is full</p>
    <h1>This weekend is fully booked.</h1>
    <p>Every place for November 5&ndash;7 in Sandy, Utah has been taken. We keep the group small on purpose &mdash; the work only happens when every couple can be seen and heard.</p>
    <p>Email us and we&rsquo;ll tell you the moment the next weekend is scheduled.</p>
    <a class="btn" href="mailto:jrbazi@bazinetfamily.com?subject=Waitlist%20for%20the%20next%20weekend">Join the waitlist</a>
  </main>
</body>
</html>
